name: Build Blender for iPad (Ironclad Fix)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16 (iOS 18 SDK / Compatible with iPadOS 26)
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        # Clone Source
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender_src

    - name: Download Libraries (Script + Force LFS)
      working-directory: ${{ github.workspace }}/blender_src
      run: |
        echo ">>> 1. Running standard make update (Host Libs)..."
        make update
        
        echo ">>> 2. Running iOS update (Target Libs)..."
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Manually Verify & Fix Libraries
      id: fix_libs
      run: |
        echo "=========================================="
        echo "   MANUAL LIBRARY VERIFICATION & FIX      "
        echo "=========================================="
        
        # 1. LOCATE THE LIBRARIES (Usually in ../lib)
        SIBLING_LIB="${{ github.workspace }}/lib"
        
        if [ ! -d "$SIBLING_LIB" ]; then
             echo "❌ ERROR: Sibling lib folder not found!"
             exit 1
        fi
        
        echo "✅ Found libraries at: $SIBLING_LIB"
        
        # 2. FORCE GIT LFS PULL (The Secret Sauce)
        # We go into each folder and force it to download real binaries
        
        echo ">>> Forcing LFS Pull for HOST (macos_arm64)..."
        if [ -d "$SIBLING_LIB/macos_arm64" ]; then
            cd "$SIBLING_LIB/macos_arm64"
            git lfs install --local
            git lfs pull
            cd - > /dev/null
        else
            echo "⚠️ Warning: macos_arm64 folder missing!"
        fi
        
        echo ">>> Forcing LFS Pull for TARGET (ios_arm64)..."
        if [ -d "$SIBLING_LIB/ios_arm64" ]; then
            cd "$SIBLING_LIB/ios_arm64"
            git lfs install --local
            git lfs pull
            cd - > /dev/null
        else
            echo "❌ CRITICAL: ios_arm64 folder missing!"
            exit 1
        fi

        # 3. MOVE TO SOURCE (Consolidate)
        # The error explicitly asked for libs at: .../blender_src/lib
        # We will put them EXACTLY there.
        
        TARGET_LIB="${{ github.workspace }}/blender_src/lib"
        
        echo ">>> Moving verified libraries to: $TARGET_LIB"
        mkdir -p "$TARGET_LIB"
        cp -R "$SIBLING_LIB/" "$TARGET_LIB/"
        
        # 4. CREATE ALIASES (Safety Net)
        cd "$TARGET_LIB"
        
        # Host Aliases
        if [ -d "macos_arm64" ]; then
            ln -sf macos_arm64 darwin
            ln -sf macos_arm64 macos
        fi
        
        # Target Aliases
        if [ -d "ios_arm64" ]; then
            ln -sf ios_arm64 arm64
            ln -sf ios_arm64 ios
        fi
        
        echo "✅ Final Library Status:"
        ls -F
        
        echo "BLENDER_LIBDIR=$TARGET_LIB" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        mkdir -p "${{ github.workspace }}/build_ios"
        cd "${{ github.workspace }}/build_ios"
        
        echo "Configuring CMake..."
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="${{ env.BLENDER_LIBDIR }}" \
          "${{ github.workspace }}/blender_src"

    - name: Build Blender App
      run: |
        cd "${{ github.workspace }}/build_ios"
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd "${{ github.workspace }}/build_ios/Release-iphoneos"
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
