name: Build Blender for iPad

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1/M2) runner
    
    steps:
    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install

    - name: Checkout Code (From Official Server)
      run: |
        # We clone MANUALLY from Blender's official server (Gitea)
        # The GitHub mirror (blender/blender) is missing LFS files for this branch.
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender

    - name: Download Libraries
      working-directory: ./blender
      run: |
        # 1. Ensure Git LFS files are pulled from the OFFICIAL server
        git lfs pull
        
        # 2. Update standard libraries (Host: macOS ARM64)
        make update
        
        # 3. Download iOS-specific libraries
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Configure CMake
      run: |
        mkdir build_ios
        cd build_ios
        
        # Configure the project for iOS ARM64
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          ../blender

    - name: Build Blender App
      working-directory: ./build_ios
      run: |
        # Compile the app
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        # Create the .ipa structure
        cd build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build_ios/Release-iphoneos/Blender_iPad.ipa
