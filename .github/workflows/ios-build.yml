name: Build Blender for iPad (Final Diagnostic)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16 (iOS 18 SDK)
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs tree
        git lfs install --skip-smudge

    - name: Setup Workspace
      working-directory: ${{ github.workspace }}
      run: |
        # 1. Clone Source
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender
        
        # 2. Setup Libs
        mkdir -p lib
        cd lib
        
        # 3. Clone Host (macOS)
        echo ">>> Cloning Host Libs..."
        git clone --depth 1 https://projects.blender.org/blender/lib-macos_arm64.git macos_arm64
        
        # 4. Clone Target (iOS)
        echo ">>> Cloning Target Libs..."
        git clone --depth 1 https://projects.blender.org/blender/lib-ios_arm64.git ios_arm64
        
        # 5. Force LFS
        echo ">>> Pulling LFS..."
        cd macos_arm64 && git lfs install --local && git lfs pull && cd ..
        cd ios_arm64 && git lfs install --local && git lfs pull && cd ..
        
        # 6. Create Aliases
        ln -s macos_arm64 darwin
        ln -s ios_arm64 arm64

    - name: Diagnostic Listing (Debug)
      working-directory: ${{ github.workspace }}/lib
      run: |
        echo "=========================================="
        echo "      LIBRARY CONTENTS CHECK              "
        echo "=========================================="
        
        echo "Listing 'darwin/python/bin' to see version:"
        ls -F darwin/python/bin/ || echo "❌ Python bin folder missing"
        
        echo "Listing 'arm64' root:"
        ls -F arm64/ | head -n 10

    - name: Configure CMake
      working-directory: ${{ github.workspace }}
      run: |
        SOURCE_DIR="${{ github.workspace }}/blender"
        LIB_DIR="${{ github.workspace }}/lib"
        
        echo "Configuring CMake..."
        
        cmake -G Xcode \
          -S "$SOURCE_DIR" \
          -B build_ios \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="$LIB_DIR"

    - name: Build Blender App
      working-directory: ${{ github.workspace }}/build_ios
      run: |
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd ${{ github.workspace }}/build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
