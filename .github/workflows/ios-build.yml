name: Build Blender for iPad (Final Fix)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Uses Xcode 16 (iOS 18 SDK) - Compatible with iPadOS 26
    
    steps:
    - name: Select Latest Xcode
      run: |
        # We use Xcode 16. This provides the iOS 18 SDK.
        # Your iPadOS 26 device will run this app via backward compatibility.
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender_src

    - name: Download Libraries (Host & Target)
      working-directory: ${{ github.workspace }}/blender_src
      run: |
        # 1. Download iOS Libs (For the iPad)
        echo ">>> Downloading iOS Target Libs..."
        python3 build_files/utils/make_update.py --use-ios-libraries
        
        # 2. Download macOS Libs (For the Builder) - THIS WAS MISSING
        # The build needs these to compile tools (makesdna) that run DURING the build.
        echo ">>> Downloading macOS Host Libs..."
        python3 build_files/utils/make_update.py --command update

    - name: Fix Library Structure
      id: fix_libs
      run: |
        echo "=========================================="
        echo "   FIXING LIBRARY STRUCTURE               "
        echo "=========================================="
        
        # Find the 'lib' folder created by the download scripts
        # It usually lands in the root or next to blender_src
        FOUND_LIB=$(find "${{ github.workspace }}" -maxdepth 3 -type d -path "*/lib/ios_arm64" | sed 's|/ios_arm64||' | head -n 1)
        
        if [ -z "$FOUND_LIB" ]; then
           echo "❌ ERROR: Libraries failed to download!"
           exit 1
        fi
        
        echo "✅ Found libraries at: $FOUND_LIB"
        
        # Define where CMake EXPECTS them to be (Inside src)
        EXPECTED_LIB="${{ github.workspace }}/blender_src/lib"
        
        # If they aren't there, link them
        if [ "$FOUND_LIB" != "$EXPECTED_LIB" ]; then
            echo "🔗 Linking lib folder to expected location..."
            rm -rf "$EXPECTED_LIB"
            ln -s "$FOUND_LIB" "$EXPECTED_LIB"
        fi
        
        # Fix Naming (Symlinks)
        cd "$FOUND_LIB"
        
        # iOS Fix: CMake looks for 'arm64', we have 'ios_arm64'
        if [ -d "ios_arm64" ] && [ ! -d "arm64" ]; then
            ln -s ios_arm64 arm64
        fi
        
        # Host Fix: CMake looks for 'darwin', we have 'macos_arm64'
        if [ -d "macos_arm64" ] && [ ! -d "darwin" ]; then
            ln -s macos_arm64 darwin
        fi
        
        echo "BLENDER_LIBDIR=$EXPECTED_LIB" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        mkdir -p "${{ github.workspace }}/build_ios"
        cd "${{ github.workspace }}/build_ios"
        
        echo "Configuring CMake..."
        
        # We explicitly set the deployment target to 16.0 
        # This ensures the app runs on your iPadOS 26 device.
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="${{ env.BLENDER_LIBDIR }}" \
          "${{ github.workspace }}/blender_src"

    - name: Build Blender App
      run: |
        cd "${{ github.workspace }}/build_ios"
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd "${{ github.workspace }}/build_ios/Release-iphoneos"
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
