name: Build Blender iPad (Path Fixed)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build-blender-ios:
    runs-on: macos-latest
    
    env:
      BLENDER_REPO: "https://projects.blender.org/blender/blender.git"
      BLENDER_BRANCH: "ios" 
      IPADOS_TARGET: "18.0" 
      PYTHON_VERSION: "3.11" 

    steps:
      # 1. Install System Tools
      - name: Install Build Tools
        run: |
          brew install cmake ninja svn git-lfs
          git lfs install

      # 2. Cache Libraries
      - name: Cache Blender Libraries
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: ./blender/lib
          key: blender-libs-ios-${{ hashFiles('blender/build_files/build_environment/install_deps.sh') }}
          restore-keys: |
            blender-libs-ios-

      # 3. Clone Source
      - name: Clone Blender (iOS Branch)
        run: |
          git clone --branch ${{ env.BLENDER_BRANCH }} --depth 1 ${{ env.BLENDER_REPO }} blender

      # 4. Download iOS Libraries
      # Note: We run this INSIDE the blender directory
      - name: Download iOS Libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        working-directory: blender
        run: |
          git lfs fetch
          git lfs checkout
          # This puts libs into blender/lib/ios_arm64
          python3 ./build_files/utils/make_update.py --use-ios-libraries

      # 5. Debug Library Path (Fixed)
      # Now running inside 'blender' so it can actually find the folder
      - name: Debug Library Structure
        working-directory: blender
        run: |
          echo "Checking Python library location..."
          # Check if the folder exists exactly where we expect it
          ls -F lib/ios_arm64/python/lib/
          
      # 6. Configure CMake (Path Logic Updated)
      - name: Configure CMake
        working-directory: blender
        run: |
          # The libs are inside the current directory (blender/lib/ios_arm64)
          # We removed the "../" that was causing the issue
          IOS_LIB_PATH="$(pwd)/lib/ios_arm64"
          echo "Using Library Path: $IOS_LIB_PATH"

          cmake -S . -B ../build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IPADOS_TARGET }} \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DWITH_GHOST_SDL=OFF \
            -DWITH_METAL_BACKEND=ON \
            -DWITH_CYCLES_DEVICE_METAL=ON \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_PYTHON_INSTALL=OFF \
            \
            -DPYTHON_INCLUDE_DIR="${IOS_LIB_PATH}/python/include/python3.11" \
            -DPYTHON_LIBRARY="${IOS_LIB_PATH}/python/lib/libpython3.11.a" \
            -DPYTHON_INCLUDE_CONFIG_DIR="${IOS_LIB_PATH}/python/include/python3.11" \
            \
            -DWITH_ALEMBIC=OFF \
            -DWITH_OPENSUBDIV=OFF \
            -DWITH_CODEC_SNDFILE=OFF \
            -DWITH_MATERIALX=OFF \
            -DWITH_GMP=OFF \
            -DWITH_HARU=OFF

      # 7. Build Blender
      - name: Build with Xcode
        run: |
          cmake --build build_ios --config Release --target install --parallel $(sysctl -n hw.ncpu)

      # 8. Patch Info.plist
      - name: Patch Info.plist for File Sharing
        run: |
          PLIST="build_ios/Release-iphoneos/Blender.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST"

      # 9. Package IPA
      - name: Create IPA Package
        run: |
          mkdir -p BlenderIPA/Payload
          cp -R build_ios/Release-iphoneos/Blender.app BlenderIPA/Payload/
          cd BlenderIPA
          zip -r ../Blender_Metal_iPad.ipa Payload

      # 10. Upload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender_Metal_iPad_PathFixed
          path: Blender_Metal_iPad.ipa
