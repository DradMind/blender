name: Build Blender for iPad

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1/M2) runner
    
    steps:
    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install

    - name: Checkout Code (Official Server)
      run: |
        # Clone explicitly from Blender's official server
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender

    - name: Download Libraries
      working-directory: ./blender
      run: |
        # 1. Pull LFS data
        git lfs pull
        
        # 2. Update standard libraries (Host: macOS)
        make update
        
        # 3. Download iOS libraries
        # We run this exactly as the developers do
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Locate Libraries (Auto-Discovery)
      id: find_libs
      run: |
        # Search for the 'ios_arm64' folder anywhere in the workspace
        # This prevents "No such file" errors by finding exactly where they are.
        
        LIB_PATH=$(find . -type d -name "ios_arm64" -print -quit)
        
        if [ -z "$LIB_PATH" ]; then
          echo "ERROR: ios_arm64 libraries not found! Download failed."
          exit 1
        fi
        
        # Get the parent directory (which is the 'lib' root CMake wants)
        # If path is ./blender/lib/ios_arm64, we want ./blender/lib
        REAL_LIB_ROOT=$(dirname "$LIB_PATH")
        
        # Convert to absolute path
        ABS_LIB_ROOT=$(cd "$REAL_LIB_ROOT" && pwd)
        
        echo "Found libraries at: $ABS_LIB_ROOT"
        echo "LIBDIR=$ABS_LIB_ROOT" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        mkdir build_ios
        cd build_ios
        
        echo "Telling CMake to use libs at: ${{ env.LIBDIR }}"
        
        # We use the discovered path in -DLIBDIR
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DLIBDIR="${{ env.LIBDIR }}" \
          ../blender

    - name: Build Blender App
      working-directory: ./build_ios
      run: |
        # Build Release version
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        cd build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build_ios/Release-iphoneos/Blender_iPad.ipa
