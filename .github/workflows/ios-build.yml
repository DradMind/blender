name: Build Blender for iPad

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1/M2) runner
    
    steps:
    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install

    - name: Checkout Code (Official Server)
      run: |
        # Clone explicitly from Blender's official server
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender

    - name: Download Libraries
      working-directory: ./blender
      run: |
        # 1. Pull LFS data
        git lfs pull
        
        # 2. Update standard libraries (Host: macOS)
        make update
        
        # 3. Download iOS libraries
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Organize Libraries
      run: |
        # DEBUG: List what we have before moving
        ls -d lib || echo "Root lib not found"
        ls -d blender/lib || echo "Blender lib not found"
        
        # CRITICAL FIX:
        # The 'blender/lib' folder exists from git (but it is wrong/empty).
        # We must DELETE it first, then move the real 'lib' folder into 'blender/'
        
        echo "Removing placeholder lib folder..."
        rm -rf blender/lib
        
        echo "Moving downloaded libraries to blender/lib..."
        mv lib blender/
        
        # Verify structure
        ls -R blender/lib/ios_arm64/python || echo "WARNING: Python libs still missing!"

    - name: Configure CMake
      run: |
        mkdir build_ios
        cd build_ios
        
        # We point CMake to the libraries we just moved into place
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          ../blender

    - name: Build Blender App
      working-directory: ./build_ios
      run: |
        # Build Release version
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        cd build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build_ios/Release-iphoneos/Blender_iPad.ipa
