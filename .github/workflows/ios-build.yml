name: Build Blender for iPad (LFS Fix)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        # Clone without trying to download LFS files yet (speed optimization)
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender

    - name: Force LFS Download (The Real Fix)
      working-directory: ./blender
      run: |
        # Initialize LFS explicitly
        git lfs install --local
        
        echo "Fetching real LFS data..."
        # This forces git to download the actual binary content
        git lfs fetch origin --all
        git lfs checkout
        
        # Verify if it worked (Check file size of a known library)
        # libmath.a should be much larger than 1KB
        FILE_SIZE=$(stat -f%z lib/ios_arm64/embree/lib/libmath.a 2>/dev/null || echo 0)
        
        if [ "$FILE_SIZE" -lt 1000 ]; then
           echo "❌ ERROR: LFS Download failed again. File size is only $FILE_SIZE bytes."
           # Fallback: Try manual update script again as a last resort
           python3 build_files/utils/make_update.py --use-ios-libraries
        else
           echo "✅ SUCCESS: Real libraries downloaded (Size: $FILE_SIZE bytes)"
        fi

    - name: Configure CMake
      run: |
        mkdir ../build_ios
        cd ../build_ios
        
        # Find the absolute path to libs
        LIB_ABS=$(cd ../blender/lib && pwd)
        
        echo "Configuring with libs at: $LIB_ABS"
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DLIBDIR="$LIB_ABS" \
          ../blender

    - name: Build Blender App
      working-directory: ./build_ios
      run: |
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build_ios/Release-iphoneos/Blender_iPad.ipa
