name: Build Blender for iPad (Manual Construction)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16 (iOS 18 SDK)
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn tree
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        # Clone Blender Source into 'blender_src'
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender_src

    - name: Construct Libraries Manually
      working-directory: ${{ github.workspace }}
      run: |
        echo "=========================================="
        echo "   MANUAL LIBRARY CONSTRUCTION            "
        echo "=========================================="
        
        # 1. Create a clean 'libs' folder at the workspace root
        mkdir -p libs
        cd libs
        
        # 2. Clone HOST Libraries (macOS - for building tools)
        echo ">>> Cloning macOS libraries..."
        git clone --depth 1 https://projects.blender.org/blender/lib-macos_arm64.git macos_arm64
        
        # 3. Clone TARGET Libraries (iOS - for the app)
        echo ">>> Cloning iOS libraries..."
        git clone --depth 1 https://projects.blender.org/blender/lib-ios_arm64.git ios_arm64
        
        # 4. Force LFS Download (Get the real binary files)
        echo ">>> Pulling LFS for macOS..."
        cd macos_arm64
        git lfs install --local
        git lfs pull
        cd ..
        
        echo ">>> Pulling LFS for iOS..."
        cd ios_arm64
        git lfs install --local
        git lfs pull
        cd ..
        
        # 5. Create Symlinks (Aliases for CMake)
        # Link macos_arm64 -> darwin (Host)
        ln -s macos_arm64 darwin
        # Link ios_arm64 -> arm64 (Target)
        ln -s ios_arm64 arm64
        
        # Save absolute path
        echo "BLENDER_LIBDIR=$(pwd)" >> $GITHUB_ENV

    - name: Generate Library Report (DEBUG)
      run: |
        echo "=========================================="
        echo "      LIBRARY FOLDER STRUCTURE            "
        echo "=========================================="
        echo "Root Lib Dir: ${{ env.BLENDER_LIBDIR }}"
        
        # Verify specific critical files exist
        if [ -f "${{ env.BLENDER_LIBDIR }}/darwin/python/bin/python3.11" ]; then
            echo "✅ HOST CHECK: Python found in darwin/macos_arm64"
        else
            echo "❌ HOST FAILURE: Python missing in darwin/macos_arm64"
        fi
        
        if [ -d "${{ env.BLENDER_LIBDIR }}/arm64/python/lib" ]; then
            echo "✅ TARGET CHECK: Python lib found in arm64/ios_arm64"
        else
            echo "❌ TARGET FAILURE: Python lib missing in arm64/ios_arm64"
        fi
        
        # Print directory tree (Level 2 depth) to show structure
        tree -L 2 "${{ env.BLENDER_LIBDIR }}"

    - name: Configure CMake
      run: |
        mkdir -p "${{ github.workspace }}/build_ios"
        cd "${{ github.workspace }}/build_ios"
        
        echo "Configuring CMake..."
        echo "Using Libs at: ${{ env.BLENDER_LIBDIR }}"
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="${{ env.BLENDER_LIBDIR }}" \
          "${{ github.workspace }}/blender_src"

    - name: Build Blender App
      run: |
        cd "${{ github.workspace }}/build_ios"
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd "${{ github.workspace }}/build_ios/Release-iphoneos"
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
