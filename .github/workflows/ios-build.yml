name: Build Blender for iPad (Video Method)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16 (iOS 18 SDK / iPadOS 26 compatible)
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs
        git lfs install --skip-smudge

    - name: Setup Workspace (Sibling Structure)
      working-directory: ${{ github.workspace }}
      run: |
        echo "=========================================="
        echo "   SETTING UP SIBLING STRUCTURE           "
        echo "=========================================="
        # We need two folders side-by-side:
        # 1. blender (Source)
        # 2. lib     (Libraries)
        
        # 1. Clone Source
        echo ">>> Cloning Blender Source..."
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender
        
        # 2. Setup Libraries Folder
        echo ">>> Creating Lib folder..."
        mkdir -p lib
        cd lib
        
        # 3. Clone HOST Libraries (macOS)
        # Matches 'make update' behavior but safer
        echo ">>> Cloning macOS libs..."
        git clone --depth 1 https://projects.blender.org/blender/lib-macos_arm64.git macos_arm64
        
        # 4. Clone TARGET Libraries (iOS)
        # Matches 'make_update.py --use-ios-libraries' behavior
        echo ">>> Cloning iOS libs..."
        git clone --depth 1 https://projects.blender.org/blender/lib-ios_arm64.git ios_arm64
        
        # 5. Force LFS (Crucial step often missed by scripts)
        echo ">>> Pulling LFS Binary Data..."
        
        cd macos_arm64
        git lfs install --local
        git lfs pull
        cd ..
        
        cd ios_arm64
        git lfs install --local
        git lfs pull
        cd ..
        
        # 6. Create Aliases (Fixes 'Requirements' error)
        # Blender looks for 'darwin' (Host) and 'arm64' (Target)
        ln -s macos_arm64 darwin
        ln -s ios_arm64 arm64
        
        echo "✅ Setup Complete. Structure:"
        ls -F

    - name: Configure CMake
      working-directory: ${{ github.workspace }}
      run: |
        # We run from the ROOT, just like the video command:
        # cmake -S blender -B build_ios
        
        # We add explicit flags for CI safety:
        cmake -G Xcode \
          -S blender \
          -B build_ios \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="${{ github.workspace }}/lib"

    - name: Build Blender App
      working-directory: ${{ github.workspace }}
      run: |
        cd build_ios
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build_ios/Release-iphoneos/Blender_iPad.ipa
