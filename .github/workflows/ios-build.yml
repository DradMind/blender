name: Build Blender for iPad (SVN + Absolute Paths)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16+
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        # Clone into 'blender_src'
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender_src

    - name: Download Libraries (The Official Way)
      working-directory: ${{ github.workspace }}/blender_src
      run: |
        # We use the official python scripts which trigger SVN downloads.
        # This is the ONLY way to get the real binaries (not LFS).
        
        echo "Downloading Host Libs (macOS)..."
        make update
        
        echo "Downloading Target Libs (iOS)..."
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Fix Library Paths (Symlinks)
      working-directory: ${{ github.workspace }}/blender_src/lib
      run: |
        echo "Verifying download..."
        # Check if python exists (proof of download)
        if [ ! -d "ios_arm64/python" ]; then
           echo "❌ ERROR: SVN Download failed. Folder is empty."
           exit 1
        fi
        
        echo "✅ Download successful."
        
        # Create Symlinks to ensure CMake finds the folder regardless of naming convention
        # We link 'arm64' -> 'ios_arm64'
        if [ -d "ios_arm64" ] && [ ! -d "arm64" ]; then
            echo "Linking arm64 -> ios_arm64"
            ln -s ios_arm64 arm64
        fi

    - name: Configure CMake
      run: |
        BUILD_DIR="${{ github.workspace }}/build_ios"
        SRC_DIR="${{ github.workspace }}/blender_src"
        LIB_DIR="${{ github.workspace }}/blender_src/lib"
        
        mkdir -p "$BUILD_DIR"
        cd "$BUILD_DIR"
        
        echo "Configuring CMake..."
        echo "Libs at: $LIB_DIR"
        
        # We explicitly pass LIBDIR so CMake looks in the right spot
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DLIBDIR="$LIB_DIR" \
          "$SRC_DIR"

    - name: Build Blender App
      run: |
        cd "${{ github.workspace }}/build_ios"
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd "${{ github.workspace }}/build_ios/Release-iphoneos"
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
