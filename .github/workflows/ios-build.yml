name: Build Blender for iPad (Python Fix)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16.0
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs tree
        git lfs install --skip-smudge

    - name: Setup Workspace
      working-directory: ${{ github.workspace }}
      run: |
        # 1. Clone Source Code
        git clone --branch main --depth 1 https://projects.blender.org/blender/blender.git blender
        
        # 2. Pull Source Assets
        cd blender
        git lfs install --local
        git lfs pull
        cd ..
        
        # 3. Setup Libraries
        mkdir -p lib
        cd lib
        
        # 4. Clone Host & Target Libs
        echo ">>> Cloning Libs..."
        git clone --depth 1 https://projects.blender.org/blender/lib-macos_arm64.git macos_arm64
        git clone --depth 1 https://projects.blender.org/blender/lib-ios_arm64.git ios_arm64
        
        # 5. Force LFS
        echo ">>> Pulling Binaries..."
        cd macos_arm64 && git lfs install --local && git lfs pull && cd ..
        cd ios_arm64 && git lfs install --local && git lfs pull && cd ..
        
        # 6. Create Aliases
        ln -s macos_arm64 darwin
        ln -s ios_arm64 arm64

    - name: Patch Build Scripts
      working-directory: ${{ github.workspace }}/blender
      run: |
        # 1. Downgrade Compiler Check
        sed -i '' 's/VERSION_LESS "17.0"/VERSION_LESS "15.0"/g' CMakeLists.txt
        
        # 2. Disable Fatal Error for Mac Libs
        sed -i '' 's/message(FATAL_ERROR/message(STATUS/g' build_files/cmake/platform/platform_apple.cmake

    - name: LOCATE PYTHON (The Fix)
      id: find_py
      working-directory: ${{ github.workspace }}/lib
      run: |
        echo "=========================================="
        echo "   HUNTING FOR PYTHON 3.13                "
        echo "=========================================="
        
        # Find the Library File (.a)
        # We look inside darwin (macos_arm64)
        PY_LIB=$(find darwin -name "libpython3.13.a" | head -n 1)
        
        # Find the Header File (Python.h)
        PY_INC=$(find darwin -name "Python.h" | head -n 1)
        
        if [ -z "$PY_LIB" ] || [ -z "$PY_INC" ]; then
            echo "❌ CRITICAL: Could not find Python 3.13 files!"
            echo "Listing darwin contents:"
            find darwin -maxdepth 4 -name "*python*"
            exit 1
        fi
        
        # Get absolute paths
        PY_LIB_ABS="${{ github.workspace }}/lib/$PY_LIB"
        PY_INC_ABS="${{ github.workspace }}/lib/$(dirname $PY_INC)"
        
        echo "✅ Found Library: $PY_LIB_ABS"
        echo "✅ Found Include: $PY_INC_ABS"
        
        # Save to ENV for CMake
        echo "PY_LIB_PATH=$PY_LIB_ABS" >> $GITHUB_ENV
        echo "PY_INC_PATH=$PY_INC_ABS" >> $GITHUB_ENV

    - name: Configure CMake
      working-directory: ${{ github.workspace }}
      run: |
        SOURCE_DIR="${{ github.workspace }}/blender"
        LIB_DIR="${{ github.workspace }}/lib"
        
        echo "Configuring CMake..."
        echo "Forcing Python Lib: ${{ env.PY_LIB_PATH }}"
        echo "Forcing Python Inc: ${{ env.PY_INC_PATH }}"
        
        cmake -G Xcode \
          -S "$SOURCE_DIR" \
          -B build_ios \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="$LIB_DIR" \
          -DPYTHON_LIBRARY="${{ env.PY_LIB_PATH }}" \
          -DPYTHON_INCLUDE_DIR="${{ env.PY_INC_PATH }}" \
          -DPYTHON_VERSION=3.13

    - name: Build Blender App
      working-directory: ${{ github.workspace }}/build_ios
      run: |
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd ${{ github.workspace }}/build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
