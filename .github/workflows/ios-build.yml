name: Build Blender for iPad (Final Fix)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Use Xcode 16+ environment
    
    steps:
    - name: Select Latest Xcode
      run: |
        # Force Xcode 16 (Required for iPadOS 26 / iOS 18 SDKs)
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        # Clone into 'blender_src'
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender_src

    - name: Download Libraries (SVN)
      working-directory: ${{ github.workspace }}/blender_src
      run: |
        # We use the python script which triggers SVN.
        # This prevents the "Empty File" errors from Git LFS.
        echo "Downloading libraries..."
        make update
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Search and Fix Libraries
      id: fix_libs
      run: |
        echo "=========================================="
        echo "   SEARCHING FOR LIBRARIES...             "
        echo "=========================================="
        
        # 1. Find the 'ios_arm64' folder anywhere in the workspace
        #    (Ignores hidden .git folders)
        IOS_LIB_PATH=$(find "${{ github.workspace }}" -path "*/ios_arm64/python" -type d -print -quit | sed 's|/python||')
        
        if [ -z "$IOS_LIB_PATH" ]; then
          echo "❌ ERROR: Could not find 'ios_arm64' folder!"
          find "${{ github.workspace }}" -maxdepth 4 -name "*lib*"
          exit 1
        fi
        
        echo "✅ Found ios_arm64 at: $IOS_LIB_PATH"
        
        # 2. Determine the Root Library Directory
        #    If path is /.../lib/ios_arm64, root is /.../lib
        LIB_ROOT=$(dirname "$IOS_LIB_PATH")
        echo "✅ Library Root is: $LIB_ROOT"
        
        # 3. Create the Symlink (CRITICAL FIX)
        #    CMake wants 'arm64', we have 'ios_arm64'. We link them.
        cd "$LIB_ROOT"
        if [ ! -d "arm64" ]; then
            echo "🔗 Creating symlink: arm64 -> ios_arm64"
            ln -s ios_arm64 arm64
        else
            echo "Symlink 'arm64' already exists."
        fi
        
        # 4. Save path for next step
        echo "BLENDER_LIBDIR=$LIB_ROOT" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        BUILD_DIR="${{ github.workspace }}/build_ios"
        SRC_DIR="${{ github.workspace }}/blender_src"
        
        mkdir -p "$BUILD_DIR"
        cd "$BUILD_DIR"
        
        echo "Configuring CMake..."
        echo "Using Libs at: ${{ env.BLENDER_LIBDIR }}"
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DLIBDIR="${{ env.BLENDER_LIBDIR }}" \
          "$SRC_DIR"

    - name: Build Blender App
      run: |
        cd "${{ github.workspace }}/build_ios"
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd "${{ github.workspace }}/build_ios/Release-iphoneos"
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
