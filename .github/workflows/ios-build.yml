name: Build Blender for iPad (Surgical Fix)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16.0 (Clang 16.0)
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs
        git lfs install --skip-smudge

    - name: Setup Workspace
      working-directory: ${{ github.workspace }}
      run: |
        echo "=========================================="
        echo "   SETTING UP WORKSPACE (MAIN BRANCH)     "
        echo "=========================================="
        
        # 1. Clone Source Code (MAIN BRANCH)
        echo ">>> Cloning Blender Source (main)..."
        git clone --branch main --depth 1 https://projects.blender.org/blender/blender.git blender
        
        # 2. PULL SOURCE LFS
        echo ">>> Pulling Source Assets..."
        cd blender
        git lfs install --local
        git lfs pull
        cd ..
        
        # 3. Setup Libraries
        mkdir -p lib
        cd lib
        
        # 4. Clone HOST Libraries (macOS)
        echo ">>> Cloning macOS libs..."
        git clone --depth 1 https://projects.blender.org/blender/lib-macos_arm64.git macos_arm64
        
        # 5. Clone TARGET Libraries (iOS)
        echo ">>> Cloning iOS libs..."
        git clone --depth 1 https://projects.blender.org/blender/lib-ios_arm64.git ios_arm64
        
        # 6. Force LFS for Libraries
        echo ">>> Pulling Library Binaries..."
        cd macos_arm64 && git lfs install --local && git lfs pull && cd ..
        cd ios_arm64 && git lfs install --local && git lfs pull && cd ..
        
        # 7. Create EXTENSIVE Aliases (Link Party)
        # We ensure every possible name exists to prevent "Missing Libs" errors
        ln -s macos_arm64 darwin
        ln -s macos_arm64 macos
        ln -s ios_arm64 arm64
        ln -s ios_arm64 ios

    - name: Surgical Compiler Patch
      working-directory: ${{ github.workspace }}/blender
      run: |
        echo "=========================================="
        echo "   SURGICAL PATCH OF CMAKELISTS.TXT       "
        echo "=========================================="
        
        # We ONLY replace 'VERSION_LESS "17.0"' with 'VERSION_LESS "15.0"'
        # This allows Clang 16.0 to pass the check.
        # It does NOT touch other "17.0" strings (like SDK versions).
        
        sed -i '' 's/VERSION_LESS "17.0"/VERSION_LESS "15.0"/g' CMakeLists.txt
        
        echo "✅ Patch Applied. Verification:"
        grep "VERSION_LESS \"15.0\"" CMakeLists.txt || echo "❌ Patch verification failed (might need manual check)"

    - name: Configure CMake
      working-directory: ${{ github.workspace }}
      run: |
        SOURCE_DIR="${{ github.workspace }}/blender"
        LIB_DIR="${{ github.workspace }}/lib"
        
        echo "Configuring CMake..."
        
        cmake -G Xcode \
          -S "$SOURCE_DIR" \
          -B build_ios \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="$LIB_DIR"

    - name: Build Blender App
      working-directory: ${{ github.workspace }}/build_ios
      run: |
        # Build Release version
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd ${{ github.workspace }}/build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
