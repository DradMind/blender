name: Build Blender for iPad (Force Host Libs)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16.0
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs tree
        git lfs install --skip-smudge

    - name: Setup Workspace
      working-directory: ${{ github.workspace }}
      run: |
        # 1. Clone Source Code
        git clone --branch main --depth 1 https://projects.blender.org/blender/blender.git blender
        
        # 2. Pull Source Assets
        cd blender
        git lfs install --local
        git lfs pull
        cd ..
        
        # 3. Setup Libraries
        mkdir -p lib
        cd lib
        
        # 4. Clone Host & Target Libs
        echo ">>> Cloning Libs..."
        git clone --depth 1 https://projects.blender.org/blender/lib-macos_arm64.git macos_arm64
        git clone --depth 1 https://projects.blender.org/blender/lib-ios_arm64.git ios_arm64
        
        # 5. Force LFS
        echo ">>> Pulling Binaries..."
        cd macos_arm64 && git lfs install --local && git lfs pull && cd ..
        cd ios_arm64 && git lfs install --local && git lfs pull && cd ..
        
        # 6. Create Aliases
        # We link 'darwin' to 'macos_arm64' so host tools find them
        ln -s macos_arm64 darwin
        ln -s ios_arm64 arm64

    - name: Patch Build Scripts (The Bypass)
      working-directory: ${{ github.workspace }}/blender
      run: |
        echo "=========================================="
        echo "   PATCHING BUILD SCRIPTS                 "
        echo "=========================================="
        
        # 1. Fix Compiler Version Check (17.0 -> 15.0)
        sed -i '' 's/VERSION_LESS "17.0"/VERSION_LESS "15.0"/g' CMakeLists.txt
        
        # 2. Fix "Mac OSX requires pre-compiled libs" Error
        # The script build_files/cmake/platform/platform_apple.cmake checks for specific files.
        # If it fails, it throws a fatal error. We will COMMENT OUT that error.
        
        TARGET_FILE="build_files/cmake/platform/platform_apple.cmake"
        
        # We look for the message(FATAL_ERROR "Mac OSX requires pre-compiled libs...")
        # and replace 'FATAL_ERROR' with 'STATUS' so it just warns us instead of stopping.
        
        sed -i '' 's/message(FATAL_ERROR/message(STATUS/g' "$TARGET_FILE"
        
        echo "✅ Patched $TARGET_FILE to treat errors as warnings."

    - name: Configure CMake
      working-directory: ${{ github.workspace }}
      run: |
        SOURCE_DIR="${{ github.workspace }}/blender"
        LIB_DIR="${{ github.workspace }}/lib"
        
        echo "Configuring CMake..."
        
        cmake -G Xcode \
          -S "$SOURCE_DIR" \
          -B build_ios \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="$LIB_DIR"

    - name: Build Blender App
      working-directory: ${{ github.workspace }}/build_ios
      run: |
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd ${{ github.workspace }}/build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
