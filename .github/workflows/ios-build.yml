name: Build Blender for iPad

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1/M2) runner
    
    steps:
    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install

    - name: Checkout Code (To 'src' folder)
      run: |
        # We clone into a folder named 'src' instead of 'blender'
        # This allows us to create the 'lib' sibling structure cleanly.
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git src

    - name: Download Libraries (Sibling Layout)
      working-directory: ./src
      run: |
        # 1. Pull LFS data inside source
        git lfs pull
        
        # 2. Update standard libraries
        # Since we are in './src', 'make update' defaults to downloading into '../lib'
        # This creates the 'lib' folder at the root of the workspace (Sibling to src)
        make update
        
        # 3. Download iOS libraries
        # This will also populate '../lib/ios_arm64'
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Verify Sibling Structure
      run: |
        # DEBUG: Prove that the folders are neighbors
        echo "Listing Workspace Root:"
        ls -d *
        
        echo "Checking for libraries in ../lib (relative to src):"
        ls lib/ios_arm64/python/bin/python3.11 || exit 1

    - name: Configure CMake
      run: |
        # Create a build folder at the ROOT (Sibling to src and lib)
        mkdir build
        cd build
        
        # We run CMake pointing to the sibling 'src' directory (../src)
        # CMake will automatically look for libraries in ../lib (which is correct now)
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          ../src

    - name: Build Blender App
      working-directory: ./build
      run: |
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        cd build/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build/Release-iphoneos/Blender_iPad.ipa
