name: Build Blender for iPad (Nuclear Fix)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16 (iOS 18 SDK)
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender_src

    - name: Download Libraries
      working-directory: ${{ github.workspace }}/blender_src
      run: |
        # 1. Download Host Libs (Standard update)
        echo ">>> Downloading macOS Host Libs..."
        make update
        
        # 2. Download Target Libs (iOS)
        echo ">>> Downloading iOS Target Libs..."
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Nuclear Library Fix (Consolidate & Link)
      id: force_layout
      run: |
        echo "=========================================="
        echo "   FORCING LIBRARY LAYOUT                 "
        echo "=========================================="
        
        SRC_DIR="${{ github.workspace }}/blender_src"
        TARGET_LIB="$SRC_DIR/lib"
        SIBLING_LIB="${{ github.workspace }}/lib"
        
        # 1. Ensure Target Directory Exists
        mkdir -p "$TARGET_LIB"
        
        # 2. HUNT & GATHER
        # If 'make update' put files in the sibling ../lib folder, move them in.
        if [ -d "$SIBLING_LIB" ]; then
            echo "✅ Found libraries in sibling folder. Moving them..."
            cp -R "$SIBLING_LIB/" "$TARGET_LIB/"
        fi
        
        # 3. VERIFY WE HAVE SOMETHING
        if [ ! -d "$TARGET_LIB/ios_arm64" ] && [ ! -d "$TARGET_LIB/macos_arm64" ]; then
            echo "❌ CRITICAL: No libraries found in sibling OR source folder!"
            echo "Searching workspace for 'ios_arm64':"
            find "${{ github.workspace }}" -maxdepth 4 -name "ios_arm64"
            exit 1
        fi
        
        # 4. FORCE ALIASES (The fix for your specific error)
        cd "$TARGET_LIB"
        echo "Creating symlinks in: $(pwd)"
        
        # Fix iOS Target: CMake looks for 'arm64' or 'ios'
        if [ -d "ios_arm64" ]; then
            ln -sf ios_arm64 arm64
            ln -sf ios_arm64 ios
            echo "✅ Linked ios_arm64 -> arm64, ios"
        else
            echo "⚠️ WARNING: ios_arm64 missing"
        fi
        
        # Fix macOS Host: CMake looks for 'darwin' or 'macos'
        if [ -d "macos_arm64" ]; then
            ln -sf macos_arm64 darwin
            ln -sf macos_arm64 macos
            echo "✅ Linked macos_arm64 -> darwin, macos"
        else
             # If macos_arm64 is missing, try to link darwin if it exists (Intel fallback)
             if [ -d "darwin" ]; then
                echo "✅ Found existing darwin folder"
             else
                echo "❌ CRITICAL: Host libraries (macos/darwin) missing! Build tools will fail."
             fi
        fi
        
        # 5. FINAL DEBUG OUTPUT
        echo "Final Lib Content:"
        ls -F
        
        echo "BLENDER_LIBDIR=$TARGET_LIB" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        mkdir -p "${{ github.workspace }}/build_ios"
        cd "${{ github.workspace }}/build_ios"
        
        echo "Configuring CMake..."
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="${{ env.BLENDER_LIBDIR }}" \
          "${{ github.workspace }}/blender_src"

    - name: Build Blender App
      run: |
        cd "${{ github.workspace }}/build_ios"
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd "${{ github.workspace }}/build_ios/Release-iphoneos"
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
