name: Build Blender for iPad

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1) runner
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        repository: blender/blender
        ref: ios  # Target the experimental iOS branch
        path: blender

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install

    - name: Download Libraries (Script Method)
      working-directory: ./blender
      run: |
        # 1. Download the standard macOS host libraries (required for build tools)
        # We use the python script directly to avoid full 'make update' overhead
        python3 build_files/utils/make_update.py --command update
        
        # 2. Download the iOS-specific libraries
        # This is the official command from the iOS branch documentation
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Configure CMake
      run: |
        mkdir build_ios
        cd build_ios
        
        # Configure the project for iOS ARM64
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          ../blender

    - name: Build Blender App
      working-directory: ./build_ios
      run: |
        # Compile the app
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        # Create the .ipa structure
        cd build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build_ios/Release-iphoneos/Blender_iPad.ipa
