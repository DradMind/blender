name: Build Blender for iPad (Manual Clone Fix)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16 (iOS 18 SDK)
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        # Clone Source Code
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender_src

    - name: Manually Clone Libraries
      working-directory: ${{ github.workspace }}/blender_src
      run: |
        echo "=========================================="
        echo "   MANUAL LIBRARY SETUP                   "
        echo "=========================================="
        
        # 1. Create the 'lib' folder exactly where CMake looks
        mkdir -p lib
        cd lib
        
        # 2. Clone HOST Libraries (macOS)
        # Required for building tools like 'makesdna'
        echo ">>> Cloning macOS libraries (Host)..."
        git clone --depth 1 https://projects.blender.org/blender/lib-macos_arm64.git macos_arm64
        
        # 3. Clone TARGET Libraries (iOS)
        # Required for the actual app
        echo ">>> Cloning iOS libraries (Target)..."
        git clone --depth 1 https://projects.blender.org/blender/lib-ios_arm64.git ios_arm64
        
        # 4. Force LFS Download (The Real Content)
        # We enter each folder and pull the binaries
        
        echo ">>> Pulling LFS for macOS..."
        cd macos_arm64
        git lfs install --local
        git lfs pull
        cd ..
        
        echo ">>> Pulling LFS for iOS..."
        cd ios_arm64
        git lfs install --local
        git lfs pull
        cd ..

    - name: Create Library Aliases (Symlinks)
      working-directory: ${{ github.workspace }}/blender_src/lib
      run: |
        echo "=========================================="
        echo "   CREATING SYMLINKS                      "
        echo "=========================================="
        
        # CMake on Apple Silicon looks for 'darwin' or 'macos'
        if [ -d "macos_arm64" ]; then
            echo "🔗 Linking macos_arm64 -> darwin"
            ln -s macos_arm64 darwin
            ln -s macos_arm64 macos
        else
            echo "❌ CRITICAL: macOS libraries failed to clone!"
            exit 1
        fi
        
        # CMake for iOS looks for 'arm64' or 'ios'
        if [ -d "ios_arm64" ]; then
            echo "🔗 Linking ios_arm64 -> arm64"
            ln -s ios_arm64 arm64
            ln -s ios_arm64 ios
        else
             echo "❌ CRITICAL: iOS libraries failed to clone!"
             exit 1
        fi
        
        # Verify Structure
        echo "✅ Library Structure:"
        ls -F

    - name: Configure CMake
      run: |
        mkdir -p "${{ github.workspace }}/build_ios"
        cd "${{ github.workspace }}/build_ios"
        
        echo "Configuring CMake..."
        
        # Point LIBDIR explicitly to our manually created folder
        LIB_PATH="${{ github.workspace }}/blender_src/lib"
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="$LIB_PATH" \
          "${{ github.workspace }}/blender_src"

    - name: Build Blender App
      run: |
        cd "${{ github.workspace }}/build_ios"
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd "${{ github.workspace }}/build_ios/Release-iphoneos"
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
