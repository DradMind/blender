name: Build Blender for iPad

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1/M2) runner
    
    steps:
    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install

    - name: Checkout Code (Official Server)
      run: |
        # Clone explicitly from Blender's official server
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender

    - name: Download Libraries
      working-directory: ./blender
      run: |
        # 1. Pull LFS data
        git lfs pull
        
        # 2. Update standard libraries (Host: macOS)
        # This downloads files to the SIBLING folder (../lib)
        make update
        
        # 3. Download iOS libraries
        # This also puts files in the SIBLING folder (../lib/ios_arm64)
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Move Libraries to Source
      working-directory: ./blender
      run: |
        # Debug: Show where they are currently
        echo "Looking for libraries in sibling folder..."
        ls -d ../lib || echo "Sibling lib not found!"
        
        # CRITICAL FIX: 
        # Move the downloaded 'ios_arm64' and 'macos_arm64' FROM ../lib TO ./lib
        # This puts them exactly where CMake is asking for them.
        
        echo "Moving libraries inside..."
        mv ../lib/ios_arm64 lib/
        mv ../lib/macos_arm64 lib/
        
        # Verify they are now in the correct place
        ls -R lib/ios_arm64/python || echo "ERROR: Move failed!"

    - name: Configure CMake
      run: |
        mkdir build_ios
        cd build_ios
        
        # We no longer need to specify LIBDIR because we moved the files 
        # to the default location CMake expects.
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          ../blender

    - name: Build Blender App
      working-directory: ./build_ios
      run: |
        # Build Release version
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        cd build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build_ios/Release-iphoneos/Blender_iPad.ipa
