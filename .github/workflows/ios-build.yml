name: Build Blender iPad (Explicit Install)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build-blender-ios:
    runs-on: macos-latest
    
    env:
      BLENDER_REPO: "https://projects.blender.org/blender/blender.git"
      BLENDER_BRANCH: "ios" 
      IPADOS_TARGET: "18.0" 
      PYTHON_VERSION: "3.11" 

    steps:
      # 1. Install System Tools
      - name: Install Build Tools
        run: |
          brew install cmake ninja svn git-lfs
          git lfs install

      # 2. Cache Libraries
      - name: Cache Blender Libraries
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: ./blender/lib
          key: blender-libs-ios-${{ hashFiles('blender/build_files/build_environment/install_deps.sh') }}
          restore-keys: |
            blender-libs-ios-

      # 3. Clone Source
      - name: Clone Blender (iOS Branch)
        run: |
          git clone --branch ${{ env.BLENDER_BRANCH }} --depth 1 ${{ env.BLENDER_REPO }} blender

      # 4. Download iOS Libraries
      - name: Download iOS Libraries
        if: steps.cache-libs.outputs.cache-hit != 'true'
        working-directory: blender
        run: |
          git lfs fetch
          git lfs checkout
          python3 ./build_files/utils/make_update.py --use-ios-libraries

      # 5. Configure CMake (With Explicit Install Path)
      - name: Configure CMake
        working-directory: blender
        run: |
          # Define paths clearly
          IOS_LIB_PATH="$(pwd)/lib/ios_arm64"
          INSTALL_DIR="$(pwd)/../install_ios"
          
          echo "Libraries: $IOS_LIB_PATH"
          echo "Installing to: $INSTALL_DIR"

          cmake -S . -B ../build_ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.IPADOS_TARGET }} \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED="NO" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_PREFIX_PATH="$IOS_LIB_PATH" \
            -DWITH_GHOST_SDL=OFF \
            -DWITH_METAL_BACKEND=ON \
            -DWITH_CYCLES_DEVICE_METAL=ON \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_PYTHON_INSTALL=OFF \
            -DPYTHON_INCLUDE_DIR="${IOS_LIB_PATH}/python/include/python3.11" \
            -DPYTHON_LIBRARY="${IOS_LIB_PATH}/python/lib/libpython3.11.a" \
            -DPYTHON_INCLUDE_CONFIG_DIR="${IOS_LIB_PATH}/python/include/python3.11" \
            -DFREETYPE_INCLUDE_DIR_freetype2="${IOS_LIB_PATH}/freetype/include/freetype2" \
            -DFREETYPE_INCLUDE_DIR_ft2build="${IOS_LIB_PATH}/freetype/include" \
            -DFREETYPE_LIBRARY="${IOS_LIB_PATH}/freetype/lib/libfreetype.a" \
            -DWITH_FFTW3=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_OPENSUBDIV=OFF \
            -DWITH_CODEC_SNDFILE=OFF \
            -DWITH_MATERIALX=OFF \
            -DWITH_GMP=OFF \
            -DWITH_HARU=OFF

      # 6. Build AND Install
      - name: Build with Xcode
        run: |
          # 'install' target forces the app to be assembled in our custom folder
          cmake --build build_ios --config Release --target install --parallel $(sysctl -n hw.ncpu)

      # 7. Package IPA (From the specific install folder)
      - name: Create IPA Package
        run: |
          # Go to the install directory we defined
          cd install_ios
          
          # Verify we have the right structure (iOS app should not have Contents/MacOS)
          if [ ! -d "Blender.app" ]; then
             echo "::error::Blender.app missing in install_ios!"
             ls -R
             exit 1
          fi

          # Patch Info.plist
          PLIST="Blender.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || true

          # Create Payload and Zip
          mkdir Payload
          cp -R Blender.app Payload/
          zip -r ../Blender_iPad_Install.ipa Payload

      # 8. Upload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Blender_iPad_Install_Build
          path: Blender_iPad_Install.ipa
