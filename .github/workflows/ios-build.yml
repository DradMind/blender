name: Build Blender for iPad

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-14  # Apple Silicon (M1/M2) runner
    env:
      # SIMPLIFICATION: We force the library location using this variable.
      # This stops the script from putting files in "sibling" or hidden folders.
      BLENDER_LIBDIR: ${{ github.workspace }}/blender/lib

    steps:
    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install

    - name: Checkout Code (Official Server)
      run: |
        # Clone explicitly from Blender's official server
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender

    - name: Download Libraries (Forced Location)
      working-directory: ./blender
      run: |
        # 1. Pull LFS data
        git lfs pull
        
        # 2. Update standard libraries (Host)
        # Because we set BLENDER_LIBDIR above, this MUST put them in blender/lib
        make update
        
        # 3. Download iOS libraries
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Verify Download
      working-directory: ./blender
      run: |
        # This is a sanity check. If this fails, the download failed (network/server issue).
        echo "Checking for iOS libraries in: $BLENDER_LIBDIR/ios_arm64"
        ls -R lib/ios_arm64/python || exit 1

    - name: Configure CMake
      run: |
        mkdir build_ios
        cd build_ios
        
        # We explicitly tell CMake: "The libs are here."
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DLIBDIR="${{ env.BLENDER_LIBDIR }}" \
          ../blender

    - name: Build Blender App
      working-directory: ./build_ios
      run: |
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        cd build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build_ios/Release-iphoneos/Blender_iPad.ipa
