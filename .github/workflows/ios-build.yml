name: Build Blender for iPad (Move Fix)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16+
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        # Clone into 'blender_src'
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender_src

    - name: Download Libraries
      working-directory: ${{ github.workspace }}/blender_src
      run: |
        # This downloads files to the SIBLING folder (../lib)
        echo "Running make update..."
        make update
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Move Libraries (The Fix)
      working-directory: ${{ github.workspace }}
      run: |
        echo "=========================================="
        echo "   MOVING LIBRARIES TO CORRECT PLACE      "
        echo "=========================================="
        
        # 1. Define paths
        SIBLING_LIB="lib"                     # The folder created by make update
        TARGET_LIB="blender_src/lib"          # The folder CMake wants
        
        # 2. Check if sibling lib exists (It should!)
        if [ -d "$SIBLING_LIB" ]; then
            echo "✅ Found sibling libraries at: $SIBLING_LIB"
            
            # 3. Create target directory
            mkdir -p "$TARGET_LIB"
            
            # 4. Move contents
            echo "Moving sibling contents into $TARGET_LIB..."
            mv "$SIBLING_LIB"/* "$TARGET_LIB"/
            
            # 5. Verify Move
            if [ -d "$TARGET_LIB/ios_arm64" ]; then
                echo "✅ Success: ios_arm64 is now inside blender_src/lib"
            else
                echo "❌ Error: Move failed."
                exit 1
            fi
        else
            echo "❌ CRITICAL: Sibling library folder not found! Download failed."
            ls -F
            exit 1
        fi

    - name: Configure CMake
      run: |
        BUILD_DIR="${{ github.workspace }}/build_ios"
        SRC_DIR="${{ github.workspace }}/blender_src"
        LIB_DIR="${{ github.workspace }}/blender_src/lib"
        
        mkdir -p "$BUILD_DIR"
        cd "$BUILD_DIR"
        
        echo "Configuring CMake..."
        echo "Libs expected at: $LIB_DIR"
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DLIBDIR="$LIB_DIR" \
          "$SRC_DIR"

    - name: Build Blender App
      run: |
        cd "${{ github.workspace }}/build_ios"
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd "${{ github.workspace }}/build_ios/Release-iphoneos"
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
