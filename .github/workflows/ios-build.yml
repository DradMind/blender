name: Build Blender for iPad (Arg Fix)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Uses Xcode 16 (iOS 18 SDK)
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender_src

    - name: Download Libraries
      working-directory: ${{ github.workspace }}/blender_src
      run: |
        # 1. Download Host Libs (macOS)
        # We use the standard 'make update' command which wraps the python script correctly.
        # This prevents the "unrecognized arguments" error.
        echo ">>> Downloading macOS Host Libs..."
        make update
        
        # 2. Download Target Libs (iOS)
        # We call the python script specifically for the iOS additions.
        echo ">>> Downloading iOS Target Libs..."
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Fix Library Structure
      id: fix_libs
      run: |
        echo "=========================================="
        echo "   FIXING LIBRARY STRUCTURE               "
        echo "=========================================="
        
        # Find where the libraries landed
        # 'make update' usually puts them in a sibling folder (../lib) relative to source
        SIBLING_LIB="${{ github.workspace }}/lib"
        INTERNAL_LIB="${{ github.workspace }}/blender_src/lib"
        
        # Check if sibling exists
        if [ -d "$SIBLING_LIB" ]; then
            echo "✅ Found libraries in sibling folder: $SIBLING_LIB"
            
            # Link it to where CMake wants it (inside blender_src)
            if [ ! -d "$INTERNAL_LIB" ]; then
                echo "🔗 Linking sibling lib -> internal lib"
                ln -s "$SIBLING_LIB" "$INTERNAL_LIB"
            fi
            
            # Now fixing naming INSIDE that folder
            cd "$SIBLING_LIB"
            
            # Fix iOS: Link ios_arm64 -> arm64
            if [ -d "ios_arm64" ] && [ ! -d "arm64" ]; then
                echo "🔗 Linking ios_arm64 -> arm64"
                ln -s ios_arm64 arm64
            fi
            
            # Fix macOS: Link macos_arm64 -> darwin
            if [ -d "macos_arm64" ] && [ ! -d "darwin" ]; then
                echo "🔗 Linking macos_arm64 -> darwin"
                ln -s macos_arm64 darwin
            fi
            
            echo "BLENDER_LIBDIR=$INTERNAL_LIB" >> $GITHUB_ENV
            
        elif [ -d "$INTERNAL_LIB/ios_arm64" ]; then
             # Fallback: maybe they are already inside?
             echo "✅ Found libraries already inside blender_src"
             cd "$INTERNAL_LIB"
             
             # Apply same fixes
             if [ -d "ios_arm64" ] && [ ! -d "arm64" ]; then ln -s ios_arm64 arm64; fi
             if [ -d "macos_arm64" ] && [ ! -d "darwin" ]; then ln -s macos_arm64 darwin; fi
             
             echo "BLENDER_LIBDIR=$INTERNAL_LIB" >> $GITHUB_ENV
        else
            echo "❌ ERROR: Libraries failed to download or are lost!"
            ls -R "${{ github.workspace }}"
            exit 1
        fi

    - name: Configure CMake
      run: |
        mkdir -p "${{ github.workspace }}/build_ios"
        cd "${{ github.workspace }}/build_ios"
        
        echo "Configuring CMake..."
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="${{ env.BLENDER_LIBDIR }}" \
          "${{ github.workspace }}/blender_src"

    - name: Build Blender App
      run: |
        cd "${{ github.workspace }}/build_ios"
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd "${{ github.workspace }}/build_ios/Release-iphoneos"
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
