name: Build Blender for iPad (Manual & Verified)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16 (iOS 18 SDK / iPadOS 26 compatible)
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs tree
        git lfs install --skip-smudge

    - name: Setup Workspace (Sibling Structure)
      working-directory: ${{ github.workspace }}
      run: |
        echo "=========================================="
        echo "   SETTING UP SIBLING STRUCTURE           "
        echo "=========================================="
        
        # 1. Clone Source Code into 'blender'
        echo ">>> Cloning Blender Source..."
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender
        
        # 2. Setup Libraries Folder at Root (Sibling)
        # The error explicitly asked for libs at: /Users/runner/work/blender/blender/lib
        # This matches ${{ github.workspace }}/lib
        echo ">>> Creating Lib folder..."
        mkdir -p lib
        cd lib
        
        # 3. Clone HOST Libraries (macOS)
        echo ">>> Cloning macOS libs (Host)..."
        git clone --depth 1 https://projects.blender.org/blender/lib-macos_arm64.git macos_arm64
        
        # 4. Clone TARGET Libraries (iOS)
        echo ">>> Cloning iOS libs (Target)..."
        git clone --depth 1 https://projects.blender.org/blender/lib-ios_arm64.git ios_arm64
        
        # 5. Force LFS Download (CRITICAL)
        # We assume the clones above only got pointers. We force the real data now.
        echo ">>> Pulling LFS Binary Data..."
        
        cd macos_arm64
        git lfs install --local
        git lfs pull
        cd ..
        
        cd ios_arm64
        git lfs install --local
        git lfs pull
        cd ..
        
        # 6. Create Aliases (The Fix for 'requires pre-compiled libs')
        # CMake needs 'darwin' for host tools and 'arm64' for iOS
        ln -s macos_arm64 darwin
        ln -s ios_arm64 arm64
        
        echo "✅ Setup Complete."

    - name: Verify Library Integrity
      working-directory: ${{ github.workspace }}/lib
      run: |
        echo "=========================================="
        echo "      VERIFYING LIBRARY CONTENT           "
        echo "=========================================="
        
        # Check if Python exists (Host)
        if [ -f "darwin/python/bin/python3.11" ]; then
             echo "✅ HOST: Python binary found."
        else
             echo "❌ HOST FAILURE: Python missing in darwin!"
             exit 1
        fi
        
        # Check File Size of a known heavy library (Target)
        # If this is small (<2KB), LFS failed.
        FILE_SIZE=$(stat -f%z arm64/embree/lib/libmath.a 2>/dev/null || echo 0)
        echo "Target Lib Size: $FILE_SIZE bytes"
        
        if [ "$FILE_SIZE" -lt 2000 ]; then
             echo "❌ TARGET FAILURE: Library file is too small ($FILE_SIZE bytes). Git LFS failed."
             exit 1
        fi
        
        echo "✅ SUCCESS: Libraries appear valid and heavy."
        
        # Show structure for debugging
        ls -F

    - name: Configure CMake
      working-directory: ${{ github.workspace }}
      run: |
        # Explicitly pointing to source and lib folders
        SOURCE_DIR="${{ github.workspace }}/blender"
        LIB_DIR="${{ github.workspace }}/lib"
        
        echo "Configuring CMake..."
        echo "Source: $SOURCE_DIR"
        echo "Libs:   $LIB_DIR"
        
        cmake -G Xcode \
          -S "$SOURCE_DIR" \
          -B build_ios \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_IPHONEOS_DEPLOYMENT_TARGET=16.0 \
          -DLIBDIR="$LIB_DIR"

    - name: Build Blender App
      working-directory: ${{ github.workspace }}/build_ios
      run: |
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd ${{ github.workspace }}/build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
