name: Build Blender for iPad (Diagnostic Mode)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn tree
        git lfs install

    - name: Checkout Code
      run: |
        # Clone to a folder named 'blender'
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender

    - name: Download Libraries
      working-directory: ./blender
      run: |
        git lfs pull
        
        # We run the updates. We won't try to move anything yet.
        # We just want to see where they land by default.
        make update
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Generate File System Report (DEBUG)
      if: always() # Run this even if previous steps failed
      run: |
        echo "=========================================="
        echo "      DIAGNOSTIC FILE SYSTEM REPORT       "
        echo "=========================================="
        
        echo "1. Current Directory:"
        pwd
        
        echo "2. Workspace Root Listing:"
        ls -F
        
        echo "3. Blender Folder Listing:"
        ls -F blender/ || echo "Blender folder not found"
        
        echo "4. Search for 'ios_arm64' (The missing folder):"
        found_path=$(find . -name "ios_arm64" -type d -print)
        if [ -z "$found_path" ]; then
          echo "❌ CRITICAL: 'ios_arm64' folder was NOT found anywhere!"
        else
          echo "✅ FOUND IT AT: $found_path"
          echo "CONTENTS:"
          ls -F "$found_path"
        fi

        echo "5. Search for 'python' inside libraries:"
        find . -name "python" -type d -maxdepth 6

        echo "=========================================="
        echo "            END OF REPORT                 "
        echo "=========================================="

    - name: Smart Configure CMake
      id: cmake_config
      run: |
        # Auto-locate the library folder based on the search above
        LIB_PATH=$(find "$GITHUB_WORKSPACE" -name "ios_arm64" -type d -maxdepth 4 | head -n 1)
        
        if [ -z "$LIB_PATH" ]; then
            echo "::error::Could not find library path automatically."
            exit 1
        fi
        
        # We found '.../something/ios_arm64'. CMake wants the PARENT of that.
        # i.e. if path is /a/b/lib/ios_arm64, CMake wants /a/b/lib
        REAL_LIB_ROOT=$(dirname "$LIB_PATH")
        
        echo "Detected Library Root: $REAL_LIB_ROOT"
        
        mkdir build_ios
        cd build_ios
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DLIBDIR="$REAL_LIB_ROOT" \
          ../blender

    - name: Build Blender App
      working-directory: ./build_ios
      run: |
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package and Upload
      run: |
        cd build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build_ios/Release-iphoneos/Blender_iPad.ipa
