name: Build Blender for iPad (Latest Xcode)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    # UPDATED: We use macos-15 to get access to Xcode 16+
    runs-on: macos-15
    
    steps:
    - name: Select Latest Xcode
      run: |
        # Force the runner to use the newest Xcode available
        # This is critical for iPadOS 26 / iOS 18+ compatibility
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install

    - name: Checkout Code
      run: |
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender

    - name: Download Libraries
      working-directory: ./blender
      run: |
        git lfs pull
        make update
        python3 build_files/utils/make_update.py --use-ios-libraries

    - name: Locate Libraries & Configure
      id: build_prep
      working-directory: ./blender
      run: |
        # Find the python folder to locate the real root
        PYTHON_PATH=$(find . -path "*/ios_arm64/python" -type d -print -quit)
        
        if [ -z "$PYTHON_PATH" ]; then
          echo "❌ ERROR: Libraries failed to download."
          exit 1
        fi
        
        # Calculate root: python -> ios_arm64 -> lib
        LIB_ROOT=$(dirname $(dirname "$PYTHON_PATH"))
        ABS_LIB_ROOT=$(cd "$LIB_ROOT" && pwd)
        
        echo "✅ FOUND LIBS AT: $ABS_LIB_ROOT"
        
        # Create Build Directory
        mkdir ../build_ios
        cd ../build_ios
        
        echo "Configuring CMake..."
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DLIBDIR="$ABS_LIB_ROOT" \
          ../blender

    - name: Build Blender App
      working-directory: ./build_ios
      run: |
        # We allow the build to retry once if it fails on a specific file lock
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd build_ios/Release-iphoneos
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: build_ios/Release-iphoneos/Blender_iPad.ipa
