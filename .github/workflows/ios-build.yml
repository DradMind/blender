name: Build Blender for iPad (Absolute Paths)

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: macos-15 # Xcode 16+
    
    steps:
    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Install System Tools
      run: |
        brew install cmake git-lfs svn
        git lfs install --skip-smudge

    - name: Checkout Code
      run: |
        # Clone explicitly into 'blender_src' folder to avoid naming confusion
        # Path will be: ${{ github.workspace }}/blender_src
        git clone --branch ios --depth 1 https://projects.blender.org/blender/blender.git blender_src

    - name: Force LFS Download
      working-directory: ${{ github.workspace }}/blender_src
      run: |
        echo "Initializing LFS..."
        git lfs install --local
        
        echo "Fetching LFS objects..."
        git lfs fetch origin --all
        git lfs checkout
        
        # Verify LFS by checking a known heavy file (libmath.a)
        # We use 'ls -lh' to print the size in the logs for debugging
        echo "Verifying file size of libmath.a:"
        ls -lh lib/ios_arm64/embree/lib/libmath.a || echo "File not found"

    - name: Verify & Locate Libraries (Diagnostic)
      id: locate
      run: |
        echo "========================================"
        echo "   ABSOLUTE PATH DIAGNOSTIC REPORT      "
        echo "========================================"
        
        # Define the exact expected path
        EXPECTED_LIB="${{ github.workspace }}/blender_src/lib"
        
        echo "Looking for libraries at: $EXPECTED_LIB"
        
        if [ -d "$EXPECTED_LIB" ]; then
            echo "✅ SUCCESS: Library folder exists."
            echo "Contents of lib/ios_arm64:"
            ls "$EXPECTED_LIB/ios_arm64" | head -n 5
        else
            echo "❌ CRITICAL FAILURE: Library folder missing at $EXPECTED_LIB"
            echo "Listing Workspace Root to see what went wrong:"
            ls -F "${{ github.workspace }}"
            exit 1
        fi
        
        # Save absolute path to env
        echo "BLENDER_LIBDIR=$EXPECTED_LIB" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        # Create build folder using ABSOLUTE path
        BUILD_DIR="${{ github.workspace }}/build_ios"
        SRC_DIR="${{ github.workspace }}/blender_src"
        
        mkdir -p "$BUILD_DIR"
        cd "$BUILD_DIR"
        
        echo "Configuring CMake..."
        echo "Source: $SRC_DIR"
        echo "Libs:   ${{ env.BLENDER_LIBDIR }}"
        
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DLIBDIR="${{ env.BLENDER_LIBDIR }}" \
          "$SRC_DIR"

    - name: Build Blender App
      run: |
        cd "${{ github.workspace }}/build_ios"
        
        xcodebuild -project Blender.xcodeproj \
          -scheme Blender \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -allowProvisioningUpdates

    - name: Package into IPA
      run: |
        cd "${{ github.workspace }}/build_ios/Release-iphoneos"
        mkdir Payload
        cp -r Blender.app Payload/
        zip -r Blender_iPad.ipa Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Blender-iPad-Build
        path: ${{ github.workspace }}/build_ios/Release-iphoneos/Blender_iPad.ipa
